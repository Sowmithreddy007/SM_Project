spring:
  datasource:
    url: jdbc:h2:file:./data/socialdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  base-url: http://localhost:5173
