spring:
  application:
    name: socialdesk
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
  servlet:
    session:
      timeout: 30d
      cookie:
        name: SOCIALDESK_SESSION
        http-only: true
        same-site: lax
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  reviewer-email: ${APP_REVIEWER_EMAIL:president@stpetershyd.com}
  backup-dir: ${APP_BACKUP_DIR:./backups}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  backup-retention-days: ${APP_BACKUP_RETENTION_DAYS:30}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@specanciens.local}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    name: ${APP_BOOTSTRAP_ADMIN_NAME:SPECANCIENS Super Admin}

logging:
  level:
    org.hibernate.SQL: warn
