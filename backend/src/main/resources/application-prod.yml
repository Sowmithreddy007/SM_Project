spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/socialdesk}
    username: ${DB_USER:socialdesk}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true

app:
  base-url: ${APP_BASE_URL:https://social.stpetershyd.com}
