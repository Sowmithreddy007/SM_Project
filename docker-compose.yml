name: specanciens-social-desk

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialdesk
      POSTGRES_USER: socialdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialdesk -d socialdesk"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/socialdesk
      DB_USER: socialdesk
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_BACKUP_DIR: /app/backups
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - excel-backups:/app/backups
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  excel-backups:
  caddy-data:
  caddy-config:
